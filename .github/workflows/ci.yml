name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validar, testear y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: jsdom 30 (los tests de interfaz) exige node >= 22.22.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar las 32 misiones
        run: npm run validate

      - name: Tests del motor y de la interfaz
        run: npm test

      - name: Comparar el motor contra bash real
        run: npm run test:bash

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  pages:
    name: Desplegar en GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
